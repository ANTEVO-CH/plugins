<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 640" width="100%" role="img"
     aria-label="How a question travels: your assistant speaks MCP to one of four Antevo connections — Executive and Trademark are public; Wealth and Mandates need your sign-in — which draw on the Antevo desk and return an answer with the record behind it">
  <title>Antevo — how a question travels</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0e12"/><stop offset="1" stop-color="#161b20"/></linearGradient>
    <style type="text/css"><![CDATA[
      .t { font-family: 'Cormorant Garamond','Iowan Old Style',Georgia,serif; fill:#f2efe9; }
      .s { font-family: 'DM Sans','Helvetica Neue',Arial,sans-serif; fill:#8a8f86; }
      .k { font-family: 'DM Sans','Helvetica Neue',Arial,sans-serif; fill:#c1a276; letter-spacing:3px; }
      .box { fill:#10151a; stroke:#2a2f33; stroke-width:1.5; }
      .gold { fill:#10151a; stroke:#c1a276; stroke-width:1.5; }
      .wire { fill:none; stroke:#3a3326; stroke-width:1.5; }
      .flow { fill:none; stroke:#c1a276; stroke-width:2; stroke-dasharray:6 18; animation: run 2.4s linear infinite; opacity:.7; }
      @keyframes run { to { stroke-dashoffset: -48; } }
    ]]></style>
  </defs>
  <rect width="1680" height="640" fill="url(#bg)"/>
  <text x="60" y="64" class="k" font-size="14">ANTEVO · HOW A QUESTION TRAVELS</text>

  <path class="wire" d="M300 320 H380"/><path class="flow" d="M300 320 H380"/>
  <g>
    <path class="wire" d="M580 320 C640 320 640 125 700 125"/><path class="wire" d="M580 320 C640 320 640 255 700 255"/>
    <path class="wire" d="M580 320 C640 320 640 385 700 385"/><path class="wire" d="M580 320 C640 320 640 515 700 515"/>
    <path class="flow" d="M580 320 C640 320 640 125 700 125"/><path class="flow" d="M580 320 C640 320 640 515 700 515"/>
    <path class="wire" d="M1010 125 C1070 125 1070 320 1130 320"/><path class="wire" d="M1010 255 C1070 255 1070 320 1130 320"/>
    <path class="wire" d="M1010 385 C1070 385 1070 320 1130 320"/><path class="wire" d="M1010 515 C1070 515 1070 320 1130 320"/>
    <path class="flow" d="M1010 255 C1070 255 1070 320 1130 320"/><path class="flow" d="M1010 385 C1070 385 1070 320 1130 320"/>
    <path class="wire" d="M1390 320 H1440"/><path class="flow" d="M1390 320 H1440"/>
  </g>

  <rect class="gold" x="60" y="262" width="240" height="116" rx="16"/>
  <text x="180" y="312" class="t" font-size="30" text-anchor="middle">Your assistant</text>
  <text x="180" y="342" class="s" font-size="14" text-anchor="middle">Claude · Cursor · VS Code</text>
  <text x="180" y="362" class="s" font-size="14" text-anchor="middle">Gemini CLI · terminal</text>

  <rect class="box" x="380" y="272" width="200" height="96" rx="16"/>
  <text x="480" y="316" class="t" font-size="30" text-anchor="middle">MCP</text>
  <text x="480" y="346" class="s" font-size="14" text-anchor="middle">Streamable HTTP</text>

  <text x="700" y="95" class="k" font-size="12">PUBLIC — NO ACCOUNT</text>
  <rect class="box" x="700" y="103" width="310" height="44" rx="12"/><text x="722" y="132" class="t" font-size="24">Executive</text><text x="990" y="131" class="s" font-size="13" text-anchor="end">markets · world · macro</text>
  <rect class="box" x="700" y="233" width="310" height="44" rx="12"/><text x="722" y="262" class="t" font-size="24">Trademark</text><text x="990" y="261" class="s" font-size="13" text-anchor="end">the registers</text>
  <text x="700" y="355" class="k" font-size="12">YOUR PERMISSION — OAUTH 2.1</text>
  <rect class="box" x="700" y="363" width="310" height="44" rx="12"/><text x="722" y="392" class="t" font-size="24">Wealth</text><text x="990" y="391" class="s" font-size="13" text-anchor="end">your household</text>
  <rect class="box" x="700" y="493" width="310" height="44" rx="12"/><text x="722" y="522" class="t" font-size="24">Mandates</text><text x="990" y="521" class="s" font-size="13" text-anchor="end">your firm</text>

  <rect class="box" x="1130" y="262" width="260" height="116" rx="16"/>
  <text x="1260" y="310" class="t" font-size="30" text-anchor="middle">The Antevo desk</text>
  <text x="1260" y="342" class="s" font-size="14" text-anchor="middle">observe · connect · explain</text>

  <rect class="gold" x="1440" y="262" width="190" height="116" rx="16"/>
  <text x="1535" y="312" class="t" font-size="30" text-anchor="middle">Your answer</text>
  <text x="1535" y="342" class="s" font-size="14" text-anchor="middle">with the record</text>
  <text x="1535" y="362" class="s" font-size="14" text-anchor="middle">behind it</text>
</svg>

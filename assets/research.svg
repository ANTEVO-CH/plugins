<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 640" width="100%" role="img" aria-label="Antevo Research: a question is typed and the research desk that answers it lights up among eighteen desks">
  <title>Antevo Research: eighteen desks, one question</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0e12"/><stop offset="1" stop-color="#161b20"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#c1a276" stop-opacity="0.14"/><stop offset="1" stop-color="#c1a276" stop-opacity="0"/></radialGradient>
    <style type="text/css"><![CDATA[
      .serif { font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif; }
      .sans  { font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; }
      .mono  { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; }
      .q { opacity: 0; animation: show 20s infinite; }
      .q1 { opacity: 1; animation-name: show1; } .q2 { animation-delay: 5s; } .q3 { animation-delay: 10s; } .q4 { animation-delay: 15s; }
      @keyframes show { 0% {opacity:0} 1.5% {opacity:1} 23% {opacity:1} 25% {opacity:0} 100% {opacity:0} }
      @keyframes show1 { 0% {opacity:1} 23% {opacity:1} 25% {opacity:0} 98.5% {opacity:0} 100% {opacity:1} }
      @media (prefers-reduced-motion: reduce) { .q { animation: none; } .q1 { opacity: 1; } }
    ]]></style>
  </defs>
  <rect width="1680" height="640" fill="url(#bg)"/>
  <circle cx="1280" cy="300" r="420" fill="url(#glow)"/>
  <text x="150" y="128" class="sans" font-size="15" letter-spacing="3" fill="#c1a276">ANTEVO RESEARCH</text>
  <text x="150" y="214" class="serif" font-size="74" fill="#f2efe9">Eighteen desks.</text>
  <text x="150" y="292" class="serif" font-style="italic" font-size="74" fill="#c1a276">One question.</text>
  <text x="150" y="346" class="sans" font-size="19" fill="#ffffffa6">A written answer from the desk that covers it, every fact dated.</text>
  <line x1="150" y1="384" x2="860" y2="384" stroke="#ffffff1f"/>
  <g class="q q1"><text x="150" y="420" class="sans" font-size="15" letter-spacing="2.5" fill="#c1a276">● ECONOMY DESK</text><text x="150" y="478" class="serif" font-style="italic" font-size="34" fill="#f2efe9">“What is keeping Swiss core inflation low?”</text></g><g class="q q2"><text x="150" y="420" class="sans" font-size="15" letter-spacing="2.5" fill="#c1a276">● SHIPPING DESK</text><text x="150" y="478" class="serif" font-style="italic" font-size="34" fill="#f2efe9">“Why are container rates rising again?”</text></g><g class="q q3"><text x="150" y="420" class="sans" font-size="15" letter-spacing="2.5" fill="#c1a276">● EQUITIES DESK</text><text x="150" y="478" class="serif" font-style="italic" font-size="34" fill="#f2efe9">“How do Nestlé’s margins compare with Unilever’s?”</text></g><g class="q q4"><text x="150" y="420" class="sans" font-size="15" letter-spacing="2.5" fill="#c1a276">● TECHNICAL DESK</text><text x="150" y="478" class="serif" font-style="italic" font-size="34" fill="#f2efe9">“How is the SMI trending against gold?”</text></g>
  <line x1="150" y1="512" x2="860" y2="512" stroke="#ffffff1f"/>
  <text x="150" y="556" class="mono" font-size="16" fill="#ffffffa6">https://api.antevo.ch/mcp/research/mcp</text>
  <text x="150" y="588" class="sans" font-size="14" fill="#ffffff73">Any Antevo account · Claude, ChatGPT, Cursor and any MCP client · research, never advice</text>
  <g><rect x="960" y="150" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="972" y="190" class="serif" font-size="30" fill="#8d7a5c">Ec</text><text x="972" y="226" class="sans" font-size="12" fill="#ffffff8c">Economy</text></g><g><rect x="1068" y="150" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1080" y="190" class="serif" font-size="30" fill="#8d7a5c">Ge</text><text x="1080" y="226" class="sans" font-size="12" fill="#ffffff8c">Geopolitics</text></g><g><rect x="1176" y="150" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1188" y="190" class="serif" font-size="30" fill="#8d7a5c">Sh</text><text x="1188" y="226" class="sans" font-size="12" fill="#ffffff8c">Shipping</text></g><g><rect x="1284" y="150" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1296" y="190" class="serif" font-size="30" fill="#8d7a5c">Re</text><text x="1296" y="226" class="sans" font-size="12" fill="#ffffff8c">Real estate</text></g><g><rect x="1392" y="150" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1404" y="190" class="serif" font-size="30" fill="#8d7a5c">St</text><text x="1404" y="226" class="sans" font-size="12" fill="#ffffff8c">Strategy</text></g><g><rect x="1500" y="150" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1512" y="190" class="serif" font-size="30" fill="#8d7a5c">Ra</text><text x="1512" y="226" class="sans" font-size="12" fill="#ffffff8c">Rates</text></g><g><rect x="960" y="254" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="972" y="294" class="serif" font-size="30" fill="#8d7a5c">Mo</text><text x="972" y="330" class="sans" font-size="12" fill="#ffffff8c">Mortgages</text></g><g><rect x="1068" y="254" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1080" y="294" class="serif" font-size="30" fill="#8d7a5c">Ma</text><text x="1080" y="330" class="sans" font-size="12" fill="#ffffff8c">Markets</text></g><g><rect x="1176" y="254" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1188" y="294" class="serif" font-size="30" fill="#8d7a5c">Co</text><text x="1188" y="330" class="sans" font-size="12" fill="#ffffff8c">Commodities</text></g><g><rect x="1284" y="254" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1296" y="294" class="serif" font-size="30" fill="#8d7a5c">Eq</text><text x="1296" y="330" class="sans" font-size="12" fill="#ffffff8c">Equities</text></g><g><rect x="1392" y="254" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1404" y="294" class="serif" font-size="30" fill="#8d7a5c">Rs</text><text x="1404" y="330" class="sans" font-size="12" fill="#ffffff8c">Results</text></g><g><rect x="1500" y="254" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1512" y="294" class="serif" font-size="30" fill="#8d7a5c">Te</text><text x="1512" y="330" class="sans" font-size="12" fill="#ffffff8c">Technical</text></g><g><rect x="960" y="358" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="972" y="398" class="serif" font-size="30" fill="#8d7a5c">Et</text><text x="972" y="434" class="sans" font-size="12" fill="#ffffff8c">ETFs</text></g><g><rect x="1068" y="358" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1080" y="398" class="serif" font-size="30" fill="#8d7a5c">Sw</text><text x="1080" y="434" class="sans" font-size="12" fill="#ffffff8c">Swiss market</text></g><g><rect x="1176" y="358" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1188" y="398" class="serif" font-size="30" fill="#8d7a5c">Tc</text><text x="1188" y="434" class="sans" font-size="12" fill="#ffffff8c">Technology</text></g><g><rect x="1284" y="358" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1296" y="398" class="serif" font-size="30" fill="#8d7a5c">Da</text><text x="1296" y="434" class="sans" font-size="12" fill="#ffffff8c">Digital assets</text></g><g><rect x="1392" y="358" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1404" y="398" class="serif" font-size="30" fill="#8d7a5c">He</text><text x="1404" y="434" class="sans" font-size="12" fill="#ffffff8c">Health</text></g><g><rect x="1500" y="358" width="96" height="92" rx="4" fill="#ffffff08" stroke="#ffffff1f"/><text x="1512" y="398" class="serif" font-size="30" fill="#8d7a5c">Pm</text><text x="1512" y="434" class="sans" font-size="12" fill="#ffffff8c">Private markets</text></g>
  <g class="q q1"><rect x="960" y="150" width="96" height="92" rx="4" fill="#f7f5ef" /><text x="972" y="190" class="serif" font-size="30" fill="#75603f">Ec</text><text x="972" y="226" class="sans" font-size="12" fill="#112833">Economy</text></g><g class="q q2"><rect x="1176" y="150" width="96" height="92" rx="4" fill="#f7f5ef" /><text x="1188" y="190" class="serif" font-size="30" fill="#75603f">Sh</text><text x="1188" y="226" class="sans" font-size="12" fill="#112833">Shipping</text></g><g class="q q3"><rect x="1284" y="254" width="96" height="92" rx="4" fill="#f7f5ef" /><text x="1296" y="294" class="serif" font-size="30" fill="#75603f">Eq</text><text x="1296" y="330" class="sans" font-size="12" fill="#112833">Equities</text></g><g class="q q4"><rect x="1500" y="254" width="96" height="92" rx="4" fill="#f7f5ef" /><text x="1512" y="294" class="serif" font-size="30" fill="#75603f">Te</text><text x="1512" y="330" class="sans" font-size="12" fill="#112833">Technical</text></g>
  <text x="960" y="488" class="sans" font-size="13" letter-spacing="2" fill="#ffffff73">THE DESK THAT ANSWERS LIGHTS UP</text>
</svg>

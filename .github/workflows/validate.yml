name: validate

# Other people's Claude installs parse these files. A manifest that disagrees
# with the marketplace, a skill whose name drifts from its folder, or a connector
# pointed off antevo.ch fails here instead of in someone's /plugin install.
on:
  push:
  pull_request:

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests, connectors, skills and assets
        run: python3 .github/scripts/validate.py
